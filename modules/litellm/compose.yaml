# ==============================================================================
# LiteLLM Module - Unified OpenAI-Compatible API Gateway
# ==============================================================================
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.61.0
    container_name: litellm
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      - PORT=4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-oracle-master-key}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - oracle_ai_backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  oracle_ai_backend:
    external: true
